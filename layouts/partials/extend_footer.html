<script src="https://cdnjs.cloudflare.com/ajax/libs/medium-zoom/1.0.6/medium-zoom.min.js" integrity="sha512-N9IJRoc3LaP3NDoiGkcPa4gG94kapGpaA5Zq9/Dr04uf5TbLFU5q0o8AbRhLKUUlp8QFS2u7S+Yti0U7QtuZvQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script>
// Image zoom
const images = Array.from(document.querySelectorAll(".post-content img"));
images.forEach(img => {
  mediumZoom(img, {
    margin: 0,
    scrollOffset: 40,
    container: null,
    template: null
  });
});

// Tabs functionality
document.querySelectorAll('.shortcode-tabs').forEach(tabContainer => {
  const buttons = tabContainer.querySelectorAll('.tab-btn');
  const panes = tabContainer.querySelectorAll('.tab-pane');

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      const tabIndex = btn.dataset.tab;

      buttons.forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-selected', 'false');
      });
      panes.forEach(p => p.classList.remove('active'));

      btn.classList.add('active');
      btn.setAttribute('aria-selected', 'true');
      tabContainer.querySelector(`.tab-pane[data-tab="${tabIndex}"]`).classList.add('active');
    });
  });
});
</script>
