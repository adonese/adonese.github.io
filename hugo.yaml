baseURL: "https://adonese.sd/"
disablePathToLower: true
languageCode: en-us
title: adonese's Blog
module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod
    - path: github.com/mfg92/hugo-shortcode-gallery
menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 1
    - identifier: slides
      name: Presentations
      url: https://slides.adonese.sd
      weight: 2
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 3
    - identifier: bio
      name: /about
      url: /bio
      weight: 5
params:
  # SEO & Social
  description: "Technical blog by Mohamed Yousif. Writing about payment systems, fintech infrastructure, software engineering, and building reliable systems."
  author: "Mohamed Yousif"
  images: ["/images/og-default.png"]  # Default OG image for posts without cover
  keywords: ["payments", "fintech", "software engineering", "noebs", "backend development"]
  social:
    twitter: "_adonese"

  # Custom assets
  customCSS: ["css/terminal.css", "css/style.css"]
  customJS: ["js/search.js"]

  # Site behavior
  env: production
  defaultTheme: light
  disableThemeToggle: true
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false

  homeInfoParams:
    Title: Mohamed Yousif
    Content: |
      Building payment infrastructure that works when everything else fails.
      Created [noebs](https://github.com/noebs/noebs), open-source payment gateway used by banks across Africa.
      Currently leading funding orchestration at Exinity Group ().
      [Resume](/resume.pdf)
  socialIcons:
    - name: "github"
      url: "https://github.com/adonese"
    - name: "twitter"
      url: "https://twitter.com/_adonese"
    - name: "linkedin"
      url: "https://linkedin.com/in/adonese"
    - name: "rss"
      url: "/index.xml"

outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search
    - LLMS
  page:
    - HTML
    - MD

outputFormats:
  LLMS:
    baseName: llms
    isPlainText: true
    mediaType: text/plain
    notAlternative: true
  MD:
    baseName: index.html
    isPlainText: true
    mediaType: text/markdown
    suffix: md
    notAlternative: true
imaging:
  exif:
    includeFields: ".*"

markup:
  goldmark:
    renderer:
      unsafe: true
