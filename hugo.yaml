baseURL: "https://adonese.sd/"
disablePathToLower: true
languageCode: en-us
title: adonese's Blog
module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod
    - path: github.com/mfg92/hugo-shortcode-gallery
menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 1
    - identifier: slides
      name: Presentations
      url: https://slides.adonese.sd
      weight: 2
    - identifier: search
      name: Search
      url: /search/
      weight: 3
    - identifier: bio
      name: /about
      url: /bio
      weight: 4
params:
  customCSS: ["css/terminal.css", "css/style.css"]
  env: production
  defaultTheme: light
  disableThemeToggle: true
  homeInfoParams:
    Title: Mohamed Yousif
    Content: |
      Building payment infrastructure that works when everything else fails.
      Created [noebs](https://github.com/noebs/noebs), open-source payment gateway used by banks across Africa.
      Currently leading funding orchestration at Exinity Group ($1B+ annually).
      [Resume](/resume.pdf)
  socialIcons:
    - name: "github"
      url: "https://github.com/adonese"
    - name: "twitter"
      url: "https://twitter.com/_adonese"
    - name: "linkedin"
      url: "https://linkedin.com/in/adonese"
    - name: "rss"
      url: "/index.xml"

outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search
imaging:
  exif:
    includeFields: ".*"

markup:
  goldmark:
    renderer:
      unsafe: true
